name: Generate APK

env:
  main_project_module: app

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      # release keystore is optional: without STORE/LOCAL secrets the apk is debug-signed
      - name: Build
        env:
          STORE: ${{ secrets.STORE }}
          LOCAL: ${{ secrets.LOCAL }}
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          if [ -n "$STORE" ] && [ -n "$LOCAL" ]; then
            echo "$STORE" | base64 -d > upload.jks
            echo "$LOCAL" | base64 -d > local.properties
          fi
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          rm -f upload.jks local.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.main_project_module }}/build/outputs/apk/release/app-release.apk

      - name: Publish (GitHub)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ env.main_project_module }}/build/outputs/apk/release/app-release.apk
